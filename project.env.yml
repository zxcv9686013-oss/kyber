# Kyber project.env example (YAML)
# Only create the folders your project actually needs.
# Kyber will not invent a dozen empty directories for you.

project:
  name: "KyberVision"
  version: "0.1"
  folders:
    build: build
    npu: npu
    xasm: xasm
    ngpu: ngpu

# toolchain selection
compiler: kyberc
optimizer: kyber-opt

# target backends
target: cpu
target.gpu: cuda

# DirectML location extracted from NuGet
directml_dir: ./third_party/directml

# Fortran install is optional and only enabled if you really need it
fortran:
  install: false
  include_dirs:
    - third_party/fortran_includes
  install_dir: build/include/fortran

# Example inheritance (uncomment to inherit common settings)
# inherit: ../common/base.env.yml
